name: Pipeline for Notification Action Microservice

on:
  push:
    branches:
      - test
    paths:
      - 'notification-action-service/**'
      - '.github/workflows/notification-action-pipeline.yml'
  pull_request:
    branches: 
      - test
    paths:
      - 'notification-action-service/**'
      - '.github/workflows/notification-action-pipeline.yml'
jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build Docker image
        run: docker buildx build -t ${{ secrets.DOCKER_USERNAME }}/${{secrets.DOCKER_IMAGE_ACT}}:latest ./notification-action-service

      - name: Push Docker image to Dockerhub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{secrets.DOCKER_IMAGE_ACT}}:latest

  deploy-to-ec2-instance:
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST_TEST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            echo "Pull, stop, and redeploy the Docker container"
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE_ACT }}:latest
            echo "Stopping and removing existing container if it exists"
            docker stop ${{secrets.DOCKER_IMAGE_ACT}} || true
            docker rm ${{secrets.DOCKER_IMAGE_ACT}} || true
            docker run --restart always
                       -d --name ${{secrets.DOCKER_IMAGE_ACT}} \
                       -p 80:80 ${{secrets.DOCKER_USERNAME}}/${{secrets.DOCKER_IMAGE_ACT}}:latest