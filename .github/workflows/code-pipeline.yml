name: Pipeline for Notification Code Microservice

on:
  push:
    branches:
      - test
    paths:
      - 'code-service/**'
      - '.github/workflows/code-pipeline.yml'
  pull_request:
    branches: 
      - test
    paths:
      - 'code-service/**'
      - '.github/workflows/code-pipeline.yml'
jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build Docker image
        run: docker buildx build -t ${{ secrets.DOCKER_USERNAME }}/${{secrets.DOCKER_IMAGE_CODE}}:latest ./code-service

      - name: Push Docker image to Dockerhub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{secrets.DOCKER_IMAGE_CODE}}:latest

  deploy-to-ec2-instance:
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST_TEST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: 
            echo "Pull, stop, and redeploy the Docker container"
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE_CODE }}:latest
            docker stop ${{secrets.DOCKER_IMAGE_CODE}} || true
            docker rm ${{secrets.DOCKER_IMAGE_CODE}} || true
            docker run --restart always -e EMAIL_FROM=${{secrets.EMAIL_FROM}} \
                       -e EMAIL_PASSWORD=${{secrets.EMAIL_PASSWORD}} \
                       -e LOGO_URL=${{secrets.LOGO_URL}} \
                       -e WEBSOCKET_URL=${{secrets.WEBSOCKET_URL}} \
                       -d --name ${{secrets.DOCKER_IMAGE_CODE}} \
                       -p 1029:1029 ${{secrets.DOCKER_USERNAME}}/${{secrets.DOCKER_IMAGE_CODE}}:latest